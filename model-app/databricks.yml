bundle:
  name: vibe-modeling

# Install-time choices (Lakebase project id, UC catalog name, SQL warehouse
# id, the optional Domain Taxonomy Builder flag and model service, the optional
# assessment flag and reader SP) flow into the App via env vars set on the
# deployer's shell: install/install.sh exports
# VIBE_MODELING_LAKEBASE_PROJECT / _DATABASE_NAME / _DEPLOYMENT_CATALOG /
# _WAREHOUSE_ID / _TAXONOMY_BUILDER_ENABLED / _TAXONOMY_MODEL_SERVICE /
# _ASSESSMENT_ENABLED / _ASSESS_READER_SP before
# `databricks bundle deploy`, and the artifacts hook below rewrites those
# values into src/app/.build/app.yml. The Databricks
# Apps `App` resource has no env field at the bundle level, so substitution
# happens at build time, not deploy time. Source src/app/app.yml is never
# modified — only the build output is rewritten.

variables:
  app_name:
    description: "Databricks App resource name (the name shown in the workspace Apps UI). Override via `--var \"app_name=<name>\"` or via install.sh's --app-name flag."
    default: vibe-modeling

sync:
  include:
    - src/app/.build

# The install-time App overrides rendered by install/build_and_render.sh
# (today: the assessment's user_api_scopes). The CLI reads includes when it
# loads the bundle, before the artifacts build hook below runs, so every deploy
# path renders first (install/install.sh and the other deploy scripts do); for a plain
# `databricks bundle deploy`, run `bash install/build_and_render.sh` first, or
# re-run the deploy when the hook says the scopes changed. A glob, so a fresh
# clone (nothing rendered, or the assessment off) still loads, with no user scopes.
include:
  - install/.generated/*.yml

artifacts:
  default:
    build: install/build_and_render.sh --bundle-hook

resources:
  apps:
    vibe-modeling-app:
      name: ${var.app_name}
      description: "Vibe Data Modeling control plane"
      source_code_path: ./src/app/.build
      # No `resources` field by default: a fresh install declares no app
      # resources, so it deploys cleanly on any workspace with no pre-existing
      # UC connection. (An empty `resources: []` is NOT equivalent — the
      # Databricks Terraform provider rejects it with an "inconsistent result"
      # error, since the API returns null for no resources.) The only resource
      # the app ever declares is the USE_CONNECTION grant on the `github_pr` UC
      # connection for the OPTIONAL publish-to-GitHub feature; it is injected by
      # the `github-publish` target below and re-applied on every deploy of that
      # target (the connection must pre-exist — see docs/github-integration-setup.md).
      # user_api_scopes: not declared here. With --enable-assessment the App
      # requests `workspace.workspace`, which lets the on-behalf-of user token
      # write into the signed-in user's own /Workspace/Users/<email>/ (the
      # assessment hand-off and its "Install skills" button); users consent
      # once. Without the flag the App declares no user_api_scopes. The scope
      # comes from install/.generated/app_scopes.yml (see `include` above),
      # which install/build_and_render.sh renders from the same
      # VIBE_MODELING_ASSESSMENT_ENABLED value it writes into app.yml: a
      # per-target override when the assessment is on, no file when it is off,
      # so an empty list is never sent. The iam.* defaults are
      # auto-granted and are NOT valid to declare (a deploy rejects them). A
      # workspace admin can restrict allowed app scopes (Settings > Development >
      # Apps); the install route reports that case. There is no documented
      # user_api_scope for Serving Endpoints. If the OBO publish turns out to
      # need an additional scope, it will be added here.

# No workspace.host hardcoded — the target workspace is driven by the CLI
# profile passed on the command line. This is what makes the bundle work
# across arbitrary Databricks accounts (AWS/Azure/any workspace) with no
# edits to this file.
#
# Usage:
#   databricks bundle deploy --profile <your-profile>
#   databricks bundle run vibe-modeling-app --profile <your-profile>
targets:
  # Default, portable target. App declares no resources, so a fresh install
  # deploys on any workspace with no pre-existing UC connection. This is the
  # target install/install.sh uses.
  dev:
    mode: development
    default: true
  # Opt-in target for the publish-to-GitHub feature. Use only on a workspace
  # where you have already created the `github_pr` UC HTTP connection
  # (docs/github-integration-setup.md): `databricks bundle deploy --target
  # github-publish --profile <p> --var "app_name=<app>"`. It adds the
  # USE_CONNECTION grant to the app and re-applies it on every deploy of this
  # target. The default `dev` target declares no resources, so this opt-in is a
  # target rather than a CLI flag (an app `resources` list can't be set via
  # --var or env).
  github-publish:
    mode: development
    resources:
      apps:
        vibe-modeling-app:
          resources:
            - name: github_conn
              uc_securable:
                securable_full_name: github_pr
                securable_type: CONNECTION
                permission: USE_CONNECTION
